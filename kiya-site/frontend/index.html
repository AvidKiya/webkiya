<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="کیا — KIYA | فروشگاه اجتماعی فارسی استایل و اکسسوری با خرید تکی و عمده جینی همکاران تأییدشده — هر روز جدید، بدون واسطه" />
    <meta name="theme-color" content="#482780" />
    <link rel="icon" type="image/webp" href="/brand/brand-profile.webp" />
    <meta name="robots" content="noindex,nofollow" />
    <title>کیا — KIYA | هر روز جدید، بدون واسطه</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kiya-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
